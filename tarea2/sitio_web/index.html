<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Ruteo resiliente de drones BVLOS — Gran Valparaíso</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { height: 100%; }
  .panel {
    position: absolute; top: 10px; right: 10px; z-index: 1000;
    background: white; padding: 12px 16px; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3); max-width: 280px; font-size: 13px;
  }
  .panel h3 { margin: 0 0 8px; font-size: 15px; }
  .panel label { display: block; margin: 6px 0 2px; }
  .legend-item { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .swatch { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  .line-swatch { width: 20px; height: 3px; display: inline-block; }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h3>Ruteo resiliente BVLOS — Gran Valparaíso</h3>
  <label><input type="checkbox" id="chk-ruta" checked> Ruta de ejemplo (pgr_dijkstra)</label>
  <label><input type="checkbox" id="chk-carabineros" checked> Cuarteles Carabineros</label>
  <label><input type="checkbox" id="chk-sismos" checked> Sismos (amenaza)</label>
  <!-- Resto de metadata/amenazas (viento, tendido eléctrico, relieve,
       población, FIRMS, CONAF) se agregan a medida que se completen sus
       scripts de extracción/carga -->
  <hr>
  <div class="legend-item"><span class="line-swatch" style="background:#2980b9"></span> Ruta de ejemplo</div>
  <div class="legend-item"><span class="swatch" style="background:#c0392b"></span> Comisaría</div>
  <div class="legend-item"><span class="swatch" style="background:#7f8c8d"></span> Otro cuartel</div>
  <div class="legend-item"><span class="swatch" style="background:#e67e22"></span> Sismo</div>
  <div id="info" style="margin-top:8px; font-size:12px; color:#555;"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
